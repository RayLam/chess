<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquatic Dolphin Chess - RTS Outlines</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a1e2b 0%, #02080c 100%);
      font-family: Arial, sans-serif;
      user-select: none;
    }
    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      background: rgba(5, 20, 30, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #00e5ff44;
      pointer-events: none;
      z-index: 100;
    }
    #status {
      font-weight: bold;
      color: #ff69b4;
    }
    canvas {
      display: block;
      cursor: pointer;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <!-- Post-Processing Engine for Game Dev Outlines -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/OutlinePass.js"></script>
</head>
<body>

  <div id="info">
    <h2 style="margin:0 0 4px 0;">Aquatic Dolphin Chess</h2>
    <p style="margin:0 0 4px 0; color: #00e5ff; font-size: 0.9em;">Human (Pink Aura) vs Computer (Red Aura)</p>
    <p style="margin:0;">Turn: <span id="status">Human (Your Turn)</span></p>
  </div>

  <script>
    const game = new Chess();
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setClearColor(0x000000, 0); // Preserves CSS gradient background
    document.body.appendChild(renderer.domElement);

    // Studio Environment Lighting
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const roomEnv = new THREE.RoomEnvironment();
    scene.environment = pmremGenerator.fromScene(roomEnv).texture;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(6, 14, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    scene.add(keyLight);

    const boardGroup = new THREE.Group();
    const piecesGroup = new THREE.Group();
    const highlightsGroup = new THREE.Group();
    const captureEffectsGroup = new THREE.Group();

    scene.add(boardGroup);
    scene.add(piecesGroup);
    scene.add(highlightsGroup);
    scene.add(captureEffectsGroup);

    // === EFFECT COMPOSER (POST-PROCESSING) ===
    const composer = new THREE.EffectComposer(renderer);
    const renderPass = new THREE.RenderPass(scene, camera);
    composer.addPass(renderPass);

    // Team Pink Aura
    const outlinePink = new THREE.OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera);
    outlinePink.edgeStrength = 4.0;
    outlinePink.edgeGlow = 1.0;
    outlinePink.edgeThickness = 2.0;
    outlinePink.visibleEdgeColor.set('#ff1493'); 
    outlinePink.hiddenEdgeColor.set('#ff1493');
    composer.addPass(outlinePink);

    // Team Red Aura
    const outlineRed = new THREE.OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera);
    outlineRed.edgeStrength = 4.0;
    outlineRed.edgeGlow = 1.0;
    outlineRed.edgeThickness = 2.0;
    outlineRed.visibleEdgeColor.set('#ff0000');
    outlineRed.hiddenEdgeColor.set('#ff0000');
    composer.addPass(outlineRed);

    const lagoonGeo = new THREE.BoxGeometry(9.6, 1.5, 9.6);
    const lagoonMat = new THREE.MeshPhongMaterial({ color: 0x004466, transparent: true, opacity: 0.85 });
    const lagoon = new THREE.Mesh(lagoonGeo, lagoonMat);
    lagoon.position.y = -0.8;
    scene.add(lagoon);

    const boardOffset = 3.5;
    const boardSquares = {};
    const clickableSquares = [];

    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const isLight = (row + col) % 2 === 0;
        const squareGeo = new THREE.BoxGeometry(1, 0.15, 1);
        const squareMat = new THREE.MeshPhongMaterial({
          color: isLight ? 0xb2ebf2 : 0x004d40,
          transparent: true,
          opacity: 0.85
        });
        const square = new THREE.Mesh(squareGeo, squareMat);
        const squareName = String.fromCharCode(97 + col) + (8 - row);

        square.position.set(col - boardOffset, 0, row - boardOffset);
        square.userData = { squareName };
        boardGroup.add(square);
        boardSquares[squareName] = square;
        clickableSquares.push(square);
      }
    }

    const loader = new THREE.GLTFLoader();
    const pieceModels = {};
    const modelFiles = { p: 'pawn.glb', n: 'knight.glb', b: 'bishop.glb', r: 'rook.glb', q: 'queen.glb', k: 'king.glb' };

    const TARGET_HEIGHT = 1.2;

    function normalizeAndCenterModel(model) {
      const wrapper = new THREE.Group();
      wrapper.add(model);
      
      model.traverse((child) => {
        if (child.isMesh && child.geometry) {
          child.geometry.computeVertexNormals();
        }
      });

      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= box.min.y;

      if (size.y > 0) {
        const scale = TARGET_HEIGHT / size.y;
        wrapper.scale.set(scale, scale, scale);
      }
      return wrapper;
    }

    function loadAllModels() {
      loader.load('./pawn.glb', (pawnGltf) => {
        const basePawnModel = normalizeAndCenterModel(pawnGltf.scene);
        pieceModels['p'] = basePawnModel;

        const types = ['n', 'b', 'r', 'q', 'k'];
        let loadedCount = 0;

        types.forEach((type) => {
          loader.load(
            `./${modelFiles[type]}`,
            (gltf) => {
              pieceModels[type] = normalizeAndCenterModel(gltf.scene);
              loadedCount++;
              if (loadedCount === types.length) renderPieces();
            },
            undefined,
            () => {
              pieceModels[type] = basePawnModel.clone(true);
              loadedCount++;
              if (loadedCount === types.length) renderPieces();
            }
          );
        });
        renderPieces();
      });
    }

    const activeAnimations = [];

    function triggerCaptureAnimation(capturedPieceType, capturedColor, position) {
      if (!pieceModels[capturedPieceType]) return;

      const animMesh = pieceModels[capturedPieceType].clone(true);
      animMesh.traverse((child) => {
        if (child.isMesh) {
          child.material = child.material.clone();
          child.material.transparent = true;
          child.material.opacity = 1.0;
          child.material.depthWrite = false;
          child.castShadow = false;
        }
      });

      animMesh.position.set(position.x, 0.1, position.z);
      captureEffectsGroup.add(animMesh);

      activeAnimations.push({
        mesh: animMesh,
        startScale: animMesh.scale.x,
        startTime: Date.now(),
        duration: 800
      });
    }

    function renderPieces() {
      while (piecesGroup.children.length > 0) {
        piecesGroup.remove(piecesGroup.children[0]);
      }

      const pinkTeam = [];
      const redTeam = [];
      const boardState = game.board();

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = boardState[row][col];
          if (piece && pieceModels[piece.type]) {
            const pieceMesh = pieceModels[piece.type].clone(true);

            // Models are left 100% UNTOUCHED to preserve raw Meshy textures
            pieceMesh.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
                
                // Sort meshes into arrays for post-processing rendering
                if (piece.color === 'w') pinkTeam.push(child);
                else redTeam.push(child);
              }
            });

            pieceMesh.rotation.y = piece.color === 'w' ? Math.PI / 2 : -Math.PI / 2;
            pieceMesh.position.set(col - boardOffset, 0.08, row - boardOffset);
            pieceMesh.userData = { squareName: String.fromCharCode(97 + col) + (8 - row) };
            piecesGroup.add(pieceMesh);
          }
        }
      }

      // Apply the neon auras
      outlinePink.selectedObjects = pinkTeam;
      outlineRed.selectedObjects = redTeam;
    }

    function executeMove(moveObj) {
      const targetPiece = game.get(moveObj.to);
      const targetSquare = boardSquares[moveObj.to];

      const executedMove = game.move(moveObj);
      if (executedMove) {
        if (targetPiece && targetSquare) {
          triggerCaptureAnimation(targetPiece.type, targetPiece.color, targetSquare.position);
        }
        renderPieces();
        updateStatus();
        return true;
      }
      return false;
    }

    const PIECE_VALUES = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

    function evaluateMove(move) {
      let score = 0;
      if (move.captured) score += PIECE_VALUES[move.captured] * 10 - PIECE_VALUES[move.piece];
      if (move.promotion) score += 80;
      
      game.move(move);
      if (game.in_checkmate()) score += 10000;
      else if (game.in_check()) score += 50;
      game.undo();

      return score;
    }

    function makeComputerMove() {
      if (game.game_over() || game.turn() !== 'b') return;
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      moves.sort((a, b) => evaluateMove(b) - evaluateMove(a));
      setTimeout(() => { executeMove(moves[0]); }, 400);
    }

    let selectedSquare = null;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('click', (event) => {
      if (game.turn() === 'b') return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableSquares, false);

      if (intersects.length > 0) {
        const squareName = intersects[0].object.userData.squareName;

        if (selectedSquare) {
          const moved = executeMove({ from: selectedSquare, to: squareName, promotion: 'q' });
          if (moved) {
            selectedSquare = null;
            clearHighlights();
            makeComputerMove();
            return;
          }
        }

        const piece = game.get(squareName);
        if (piece && piece.color === game.turn()) {
          selectedSquare = squareName;
          clearHighlights();
          highlightSquare(squareName, 0xffff00);
          const moves = game.moves({ square: squareName, verbose: true });
          moves.forEach((m) => highlightSquare(m.to, 0x00ff00));
        } else {
          selectedSquare = null;
          clearHighlights();
        }
      }
    });

    function clearHighlights() {
      while (highlightsGroup.children.length > 0) {
        highlightsGroup.remove(highlightsGroup.children[0]);
      }
    }

    function highlightSquare(squareName, colorHex) {
      const target = boardSquares[squareName];
      if (!target) return;
      const highlightGeo = new THREE.BoxGeometry(1.02, 0.18, 1.02);
      const highlightMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.7 });
      const mesh = new THREE.Mesh(highlightGeo, highlightMat);
      mesh.position.set(target.position.x, 0.01, target.position.z);
      highlightsGroup.add(mesh);
    }

    function updateStatus() {
      const statusEl = document.getElementById('status');
      let statusText = game.turn() === 'w' ? 'Human (Your Turn)' : 'Computer Thinking...';
      if (game.in_check()) statusText += ' - CHECK!';
      if (game.in_checkmate()) statusText = game.turn() === 'w' ? 'Game Over - Computer Wins!' : 'Game Over - You Win!';
      statusEl.textContent = statusText;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    loadAllModels();

    function animate() {
      requestAnimationFrame(animate);

      const now = Date.now();
      const time = now * 0.0025;
      piecesGroup.children.forEach((piece, idx) => {
        piece.position.y = 0.08 + Math.sin(time + idx * 0.4) * 0.015;
      });

      for (let i = activeAnimations.length - 1; i >= 0; i--) {
        const anim = activeAnimations[i];
        const elapsed = now - anim.startTime;
        const progress = Math.min(elapsed / anim.duration, 1.0);

        if (progress >= 1.0) {
          captureEffectsGroup.remove(anim.mesh);
          activeAnimations.splice(i, 1);
        } else {
          const scaleMult = 1.0 + progress * 1.5;
          anim.mesh.scale.set(anim.startScale * scaleMult, anim.startScale * scaleMult, anim.startScale * scaleMult);
          anim.mesh.position.y += 0.02;
          anim.mesh.rotation.y += 0.15;

          anim.mesh.traverse((child) => {
            if (child.isMesh && child.material) {
              child.material.opacity = 1.0 - progress;
            }
          });
        }
      }

      controls.update();
      composer.render(); // Powered by EffectComposer instead of standard renderer
    }
    animate();
  </script>
</body>
</html>
