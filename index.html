<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquatic Dolphin Chess</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a1e2b 0%, #02080c 100%);
      font-family: Arial, sans-serif;
    }
    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      background: rgba(5, 20, 30, 0.85);
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid #00e5ff44;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 100;
    }
    #status {
      font-weight: bold;
      color: #ff69b4;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <div id="info">
    <h2 style="margin:0 0 6px 0; font-size: 1.3em;">Aquatic Dolphin Chess</h2>
    <p style="margin:0;">Turn: <span id="status">Pink Team</span></p>
  </div>

  <script>
    // --- 1. ENGINE & SCENE SETUP ---
    const game = new Chess();
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a1e2b, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.enableDamping = true;

    // --- 2. LIGHTING & ENVIRONMENT ---
    // Increased ambient light so both sides stay brightly lit from all angles
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(6, 14, 8);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const boardGroup = new THREE.Group();
    const piecesGroup = new THREE.Group();
    const highlightsGroup = new THREE.Group();
    scene.add(boardGroup);
    scene.add(piecesGroup);
    scene.add(highlightsGroup);

    // Blue Water Lagoon Base
    const lagoonGeo = new THREE.BoxGeometry(9.6, 1.5, 9.6);
    const lagoonMat = new THREE.MeshPhongMaterial({ color: 0x005577, transparent: true, opacity: 0.85 });
    const lagoon = new THREE.Mesh(lagoonGeo, lagoonMat);
    lagoon.position.y = -0.8;
    scene.add(lagoon);

    // Glass Board Squares
    const boardOffset = 3.5;
    const boardSquares = {};

    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const isLight = (row + col) % 2 === 0;
        const squareGeo = new THREE.BoxGeometry(1, 0.1, 1);
        const squareMat = new THREE.MeshPhongMaterial({
          color: isLight ? 0xb2ebf2 : 0x004d40,
          transparent: true,
          opacity: 0.75
        });
        const square = new THREE.Mesh(squareGeo, squareMat);
        const squareName = String.fromCharCode(97 + col) + (8 - row);

        square.position.set(col - boardOffset, 0, row - boardOffset);
        square.receiveShadow = true;
        square.userData = { squareName };
        boardGroup.add(square);
        boardSquares[squareName] = square;
      }
    }

    // --- 3. NAMED ASSET LOADING SYSTEM ---
    const loader = new THREE.GLTFLoader();
    const pieceModels = {};
    const pieceYOffsets = {};

    const modelFiles = {
      p: 'pawn.glb',
      n: 'knight.glb',
      b: 'bishop.glb',
      r: 'rook.glb',
      q: 'queen.glb',
      k: 'king.glb'
    };

    const whiteMaterial = new THREE.MeshStandardMaterial({ color: 0xffb6c1,
