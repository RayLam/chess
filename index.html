<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquatic Dolphin Chess</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a1e2b 0%, #02080c 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #ffffff;
      background: rgba(10, 30, 45, 0.75);
      backdrop-filter: blur(8px);
      padding: 16px 22px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      pointer-events: none;
    }
    #status {
      font-weight: bold;
      color: #ff80bf;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <div id="info">
    <h2 style="margin: 0 0 8px 0; font-weight: 500;">Aquatic Dolphin Chess</h2>
    <p style="margin: 0 0 6px 0;">Turn: <span id="status">White (Light Pink)</span></p>
    <p style="margin: 0; font-size: 0.85em; opacity: 0.8;">Click a piece, then click a highlighted square to move.</p>
  </div>

  <script>
    // --- 1. SCENE & ENGINE SETUP ---
    const game = new Chess();
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a1e2b, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- 2. ADVANCED AQUATIC LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xd0f0ff, 0.8);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.position.set(8, 15, 6);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.bias = -0.0001;
    scene.add(sunLight);

    const waterLight = new THREE.PointLight(0x00e5ff, 2, 15);
    waterLight.position.set(0, -1, 0);
    scene.add(waterLight);

    // --- 3. BOARD & LAGOON DECK ---
    const boardGroup = new THREE.Group();
    const piecesGroup = new THREE.Group();
    const highlightsGroup = new THREE.Group();
    scene.add(boardGroup);
    scene.add(piecesGroup);
    scene.add(highlightsGroup);

    // Lagoon Water Base
    const lagoonGeo = new THREE.BoxGeometry(9.6, 1.8, 9.6);
    const lagoonMat = new THREE.MeshPhysicalMaterial({
      color: 0x004455,
      transmission: 0.85,
      opacity: 1,
      transparent: true,
      roughness: 0.1,
      ior: 1.333,
      thickness: 2.0
    });
    const lagoon = new THREE.Mesh(lagoonGeo, lagoonMat);
    lagoon.position.y = -0.95;
    scene.add(lagoon);

    // Glass Checkerboard
    const squareSize = 1;
    const boardOffset = 3.5;
    const boardSquares = {};

    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const isLight = (row + col) % 2 === 0;
        const squareGeo = new THREE.BoxGeometry(squareSize, 0.08, squareSize);
        const squareMat = new THREE.MeshPhysicalMaterial({
          color: isLight ? 0xffffff : 0x005577,
          transmission: isLight ? 0.9 : 0.4,
          opacity: 0.85,
          transparent: true,
          roughness: 0.1,
          metalness: 0.1,
          reflectivity: 0.9
        });
        const square = new THREE.Mesh(squareGeo, squareMat);
        
        const file = String.fromCharCode(97 + col);
        const rank = 8 - row;
        const squareName = file + rank;

        square.position.set(col - boardOffset, 0, row - boardOffset);
        square.receiveShadow = true;
        square.userData = { squareName, col, row };
        
        boardGroup.add(square);
        boardSquares[squareName] = square;
      }
    }

    // --- 4. DETAILED DOLPHIN PROCEDURAL MODEL ---
    function createDetailedDolphin(pieceType) {
      const group = new THREE.Group();

      // Curved Dolphin Body
      const bodyCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0.1, -0.2),
        new THREE.Vector3(0, 0.35, -0.05),
        new THREE.Vector3(0, 0.5, 0.15),
        new THREE.Vector3(0, 0.3, 0.35)
      ]);
      const bodyGeo = new THREE.TubeGeometry(bodyCurve, 20, 0.12, 16, false);
      const body = new THREE.Mesh(bodyGeo);
      group.add(body);

      // Snout
      const snoutGeo = new THREE.ConeGeometry(0.05, 0.2, 12);
      snoutGeo.rotateX(Math.PI / 2);
      const snout = new THREE.Mesh(snoutGeo);
      snout.position.set(0, 0.12, -0.28);
      group.add(snout);

      // Tail Fluke
      const tailGeo = new THREE.BoxGeometry(0.25, 0.02, 0.1);
      const tail = new THREE.Mesh(tailGeo);
      tail.position.set(0, 0.28, 0.38);
      tail.rotation.x = 0.3;
      group.add(tail);

      // Base Pedestal
      const baseGeo = new THREE.CylinderGeometry(0.35, 0.38, 0.08, 24);
      const base = new THREE.Mesh(baseGeo);
      base.position.y = 0.04;
      group.add(base);

      // Type Specific Features
      if (pieceType === 'k' || pieceType === 'q') {
        const crownGeo = new THREE.ToroidGeometry ? new THREE.CylinderGeometry(0.08, 0.12, 0.1, 12) : new THREE.CylinderGeometry(0.08, 0.12, 0.1, 12);
        const crown = new THREE.Mesh(crownGeo);
        crown.position.set(0, 0.58, 0.15);
        group.add(crown);
      }

      return group;
    }

    // Materials reflecting design renders
    const whiteMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffb6c1,
      roughness: 0.15,
      metalness: 0.1,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1
    });

    const blackMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x990055,
      roughness: 0.15,
      metalness: 0.2,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1
    });

    function renderPieces() {
      while (piecesGroup.children.length > 0) {
        piecesGroup.remove(piecesGroup.children[0]);
      }

      const boardState = game.board();
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = boardState[row][col];
          if (piece) {
            const pieceMesh = createDetailedDolphin(piece.type);
            const mat = piece.color === 'w' ? whiteMaterial : blackMaterial;
            
            pieceMesh.traverse((child) => {
              if (child.isMesh) {
                child.material = mat;
                child.castShadow = true;
                child.receiveShadow = true;
              }
            });

            // Facing opposite player
            if (piece.color === 'b') pieceMesh.rotation.y = Math.PI;

            pieceMesh.position.set(col - boardOffset, 0.04, row - boardOffset);
            pieceMesh.userData = { squareName: String.fromCharCode(97 + col) + (8 - row), piece };
            piecesGroup.add(pieceMesh);
          }
        }
      }
    }

    renderPieces();

    // --- 5. INTERACTION LOGIC ---
    let selectedSquare = null;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function clearHighlights() {
      while (highlightsGroup.children.length > 0) {
        highlightsGroup.remove(highlightsGroup.children[0]);
      }
    }

    function highlightSquare(squareName, color = 0x00ffff) {
      const target = boardSquares[squareName];
      if (!target) return;
      const highlightGeo = new THREE.RingGeometry(0.2, 0.4, 32);
      const highlightMat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
      const mesh = new THREE.Mesh(highlightGeo, highlightMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(target.position.x, 0.05, target.position.z);
      highlightsGroup.add(mesh);
    }

    window.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([...boardGroup.children, ...piecesGroup.children], true);

      if (intersects.length > 0) {
        let clickedObject = intersects[0].object;
        while (clickedObject.parent && clickedObject.parent !== boardGroup && clickedObject.parent !== piecesGroup) {
          clickedObject = clickedObject.parent;
        }

        const squareName = clickedObject.userData.squareName;

        if (selectedSquare) {
          const move = game.move({
            from: selectedSquare,
            to: squareName,
            promotion: 'q'
          });

          if (move) {
            selectedSquare = null;
            clearHighlights();
            renderPieces();
            updateStatus();
            return;
          }
        }

        const piece = game.get(squareName);
        if (piece && piece.color === game.turn()) {
          selectedSquare = squareName;
          clearHighlights();
          highlightSquare(squareName, 0xffd700);

          const moves = game.moves({ square: squareName, verbose: true });
          moves.forEach((m) => highlightSquare(m.to, 0x00ff88));
        } else {
          selectedSquare = null;
          clearHighlights();
        }
      }
    });

    function updateStatus() {
      const statusEl = document.getElementById('status');
      let statusText = game.turn() === 'w' ? 'White (Light Pink)' : 'Magenta (Dark Pink)';
      if (game.in_check()) statusText += ' - CHECK!';
      if (game.in_checkmate()) statusText = 'Game Over - Checkmate!';
      if (game.in_draw()) statusText = 'Game Over - Draw!';
      statusEl.textContent = statusText;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 6. ANIMATION & RENDER LOOP ---
    function animate(time) {
      requestAnimationFrame(animate);
      controls.update();
      
      // Gentle water pulse
      waterLight.intensity = 1.5 + Math.sin(time * 0.002) * 0.5;
      
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
