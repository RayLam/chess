<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquatic Dolphin Chess</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a1e2b 0%, #02080c 100%);
      font-family: Arial, sans-serif;
    }
    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      background: rgba(5, 20, 30, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #00e5ff44;
      pointer-events: none;
      z-index: 100;
    }
    #status {
      font-weight: bold;
      color: #ff69b4;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <div id="info">
    <h2 style="margin:0 0 4px 0;">Aquatic Dolphin Chess</h2>
    <p style="margin:0;">Turn: <span id="status">Light Pink Team</span></p>
  </div>

  <script>
    const game = new Chess();
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;

    // Lighting Setup
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(6, 14, 8);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const boardGroup = new THREE.Group();
    const piecesGroup = new THREE.Group();
    const highlightsGroup = new THREE.Group();
    scene.add(boardGroup);
    scene.add(piecesGroup);
    scene.add(highlightsGroup);

    // Lagoon Base
    const lagoonGeo = new THREE.BoxGeometry(9.6, 1.5, 9.6);
    const lagoonMat = new THREE.MeshPhongMaterial({ color: 0x005577, transparent: true, opacity: 0.85 });
    const lagoon = new THREE.Mesh(lagoonGeo, lagoonMat);
    lagoon.position.y = -0.8;
    scene.add(lagoon);

          transparent: true,
          opacity: 0.75
