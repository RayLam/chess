<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquatic Dolphin Chess</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #02080c;
      font-family: Arial, sans-serif;
    }
    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      background: rgba(5, 20, 30, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #00e5ff;
      pointer-events: none;
      z-index: 100;
    }
    #status {
      font-weight: bold;
      color: #ff69b4;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <div id="info">
    <h2 style="margin:0 0 4px 0;">Aquatic Dolphin Chess</h2>
    <p style="margin:0;">Turn: <span id="status">Pink Team</span></p>
  </div>

  <script>
    const game = new Chess();
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);

    // Bright lighting setup
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 12, 8);
    scene.add(dirLight);

    const boardGroup = new THREE.Group();
    const piecesGroup = new THREE.Group();
    const highlightsGroup = new THREE.Group();
    scene.add(boardGroup);
    scene.add(piecesGroup);
    scene.add(highlightsGroup);

    // Base Lagoon
    const lagoonGeo = new THREE.BoxGeometry(9.6, 1.5, 9.6);
    const lagoonMat = new THREE.MeshPhongMaterial({ color: 0x005577, transparent: true, opacity: 0.85 });
    const lagoon = new THREE.Mesh(lagoonGeo, lagoonMat);
    lagoon.position.y = -0.8;
    scene.add(lagoon);

    // Glass Board
    const boardOffset = 3.5;
    const boardSquares = {};

    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const isLight = (row + col) % 2 === 0;
        const squareGeo = new THREE.BoxGeometry(1, 0.1, 1);
        const squareMat = new THREE.MeshPhongMaterial({
          color: isLight ? 0xb2ebf2 : 0x004d40,
          transparent: true,
          opacity: 0.75
        });
        const square = new THREE.Mesh(squareGeo, squareMat);
        const squareName = String.fromCharCode(97 + col) + (8 - row);

        square.position.set(col - boardOffset, 0, row - boardOffset);
        square.userData = { squareName };
        boardGroup.add(square);
        boardSquares[squareName] = square;
      }
    }

    // Material definitions
    const whiteMaterial = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.2 }); // Light Pink
    const blackMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }); // Bright White

    // Loader logic with safe fallback
    const loader = new THREE.GLTFLoader();
    const pieceModels = {};
    const modelFiles = { p: 'pawn.glb', n: 'knight.glb', b: 'bishop.glb', r: 'rook.glb', q: 'queen.glb', k: 'king.glb' };

    function loadModels() {
      let loadedCount = 0;
      const types = Object.keys(modelFiles);

      types.forEach((type) => {
        loader.load(
          `./${modelFiles[type]}`,
          (gltf) => {
            const model = gltf.scene;
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.z);
            if (maxDim > 0) {
              const scale = 0.75 / maxDim;
              model.scale.set(scale, scale, scale);
            }
            pieceModels[type] = model;
            checkDone();
          },
          undefined,
          () => {
            // Safe fallback if specific glb isn't uploaded yet
            if (type !== 'p' && pieceModels['p']) {
              pieceModels[type] = pieceModels['p'].clone();
            }
            checkDone();
          }
        );
      });

      function checkDone() {
        loadedCount++;
        if (loadedCount === types.length) {
          renderPieces();
        }
      }
    }

    function renderPieces() {
      while (piecesGroup.children.length > 0) {
        piecesGroup.remove(piecesGroup.children[0]);
      }

      const boardState = game.board();
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = boardState[row][col];
          if (piece && pieceModels[piece.type]) {
            const pieceMesh = pieceModels[piece.type].clone(true);
            const mat = piece.color === 'w' ? whiteMaterial : blackMaterial;

            pieceMesh.traverse((child) => {
              if (child.isMesh) child.material = mat;
            });

            if (piece.color === 'b') pieceMesh.rotation.y = Math.PI;

            pieceMesh.position.set(col - boardOffset, 0.05, row - boardOffset);
            pieceMesh.userData = { squareName: String.fromCharCode(97 + col) + (8 - row) };
            piecesGroup.add(pieceMesh);
          }
        }
      }
    }

    // Interactive Controls
    let selectedSquare = null;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function clearHighlights() {
      while (highlightsGroup.children.length > 0) {
        highlightsGroup.remove(highlightsGroup.children[0]);
      }
    }

    function highlightSquare(squareName, colorHex) {
      const target = boardSquares[squareName];
      if (!target) return;
      const highlightGeo = new THREE.PlaneGeometry(0.9, 0.9);
      const highlightMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
      const mesh = new THREE.Mesh(highlightGeo, highlightMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(target.position.x, 0.06, target.position.z);
      highlightsGroup.add(mesh);
    }

    window.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([...boardGroup.children, ...piecesGroup.children], true);

      if (intersects.length > 0) {
        let clickedObject = intersects[0].object;
        while (clickedObject.parent && clickedObject.parent !== boardGroup && clickedObject.parent !== piecesGroup) {
          clickedObject = clickedObject.parent;
        }

        const squareName = clickedObject.userData.squareName;

        if (selectedSquare) {
          const move = game.move({ from: selectedSquare, to: squareName, promotion: 'q' });
          if (move) {
            selectedSquare = null;
            clearHighlights();
            renderPieces();
            updateStatus();
            return;
          }
        }

        const piece = game.get(squareName);
        if (piece && piece.color === game.turn()) {
          selectedSquare = squareName;
          clearHighlights();
          highlightSquare(squareName, 0xffff00);
          const moves = game.moves({ square: squareName, verbose: true });
          moves.forEach((m) => highlightSquare(m.to, 0x00ff00));
        } else {
          selectedSquare = null;
          clearHighlights();
        }
      }
    });

    function updateStatus() {
      const statusEl = document.getElementById('status');
      let statusText = game.turn() === 'w' ? 'Pink Team' : 'White Team';
      if (game.in_check()) statusText += ' - CHECK!';
      if (game.in_checkmate()) statusText = 'Game Over - Checkmate!';
      statusEl.textContent = statusText;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    loadModels();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
