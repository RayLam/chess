<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquatic Dolphin Chess</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a1e2b 0%, #02080c 100%);
      font-family: Arial, sans-serif;
    }
    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      background: rgba(5, 20, 30, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #00e5ff44;
      pointer-events: none;
      z-index: 100;
    }
    #status {
      font-weight: bold;
      color: #ff69b4;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <div id="info">
    <h2 style="margin:0 0 4px 0;">Aquatic Dolphin Chess</h2>
    <p style="margin:0;">Turn: <span id="status">Light Pink Team</span></p>
  </div>

  <script>
    const game = new Chess();
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
    keyLight.position.set(5, 12, 8);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x00e5ff, 0.5);
    fillLight.position.set(-5, 6, -5);
    scene.add(fillLight);

    const boardGroup = new THREE.Group();
    const piecesGroup = new THREE.Group();
    const highlightsGroup = new THREE.Group();
    scene.add(boardGroup);
    scene.add(piecesGroup);
    scene.add(highlightsGroup);

    // Lagoon Base
    const lagoonGeo = new THREE.BoxGeometry(9.6, 1.5, 9.6);
    const lagoonMat = new THREE.MeshPhongMaterial({ color: 0x004466, transparent: true, opacity: 0.85 });
    const lagoon = new THREE.Mesh(lagoonGeo, lagoonMat);
    lagoon.position.y = -0.8;
    scene.add(lagoon);

    // Glass Board
    const boardOffset = 3.5;
    const boardSquares = {};

    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const isLight = (row + col) % 2 === 0;
        const squareGeo = new THREE.BoxGeometry(1, 0.1, 1);
        const squareMat = new THREE.MeshPhongMaterial({
          color: isLight ? 0xb2ebf2 : 0x004d40,
          transparent: true,
          opacity: 0.75
        });
        const square = new THREE.Mesh(squareGeo, squareMat);
        const squareName = String.fromCharCode(97 + col) + (8 - row);

        square.position.set(col - boardOffset, 0, row - boardOffset);
        square.receiveShadow = true;
        square.userData = { squareName };
        boardGroup.add(square);
        boardSquares[squareName] = square;
      }
    }

    // Team Materials
    const whiteMaterial = new THREE.MeshStandardMaterial({ color: 0xffa3c4, roughness: 0.2, metalness: 0.1 });
    const blackMaterial = new THREE.MeshStandardMaterial({ color: 0x99004d, roughness: 0.2, metalness: 0.1 });

    const loader = new THREE.GLTFLoader();
    const pieceModels = {};
    const modelFiles = { p: 'pawn.glb', n: 'knight.glb', b: 'bishop.glb', r: 'rook.glb', q: 'queen.glb', k: 'king.glb' };

    function normalizeAndCenterModel(model) {
      const wrapper = new THREE.Group();
      wrapper.add(model);

      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= box.min.y;

      const maxDim = Math.max(size.x, size.z);
      if (maxDim > 0) {
        const scale = 0.75 / maxDim;
        wrapper.scale.set(scale, scale, scale);
      }

      return wrapper;
    }

    // Safe Non-Blocking Loader
    function loadAllModels() {
      const entries = Object.entries(modelFiles);
      let loadedCount = 0;

      entries.forEach(([type, fileName]) => {
        loader.load(
          `./${fileName}`,
          (gltf) => {
            pieceModels[type] = normalizeAndCenterModel(gltf.scene);
            loadedCount++;
            if (loadedCount === entries.length) renderPieces();
          },
          undefined,
          (err) => {
            console.warn(`Could not load ./${fileName}, using pawn fallback:`, err);
            // Fallback to pawn.glb if a piece model is missing
            if (pieceModels['p']) {
              pieceModels[type] = pieceModels['p'].clone(true);
            }
            loadedCount++;
            if (loadedCount === entries.length) renderPieces();
          }
        );
      });
    }

    function renderPieces() {
      while (piecesGroup.children.length > 0) {
        piecesGroup.remove(piecesGroup.children[0]);
      }

      const boardState = game.board();
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = boardState[row][col];
          if (piece && pieceModels[piece.type]) {
            const pieceMesh = pieceModels[piece.type].clone(true);
            const targetMaterial = piece.color === 'w' ? whiteMaterial : blackMaterial;

            pieceMesh.traverse((child) => {
              if (child.isMesh) {
                child.material = targetMaterial;
                child.castShadow = true;
                child.receiveShadow = true;
              }
            });

            pieceMesh.rotation.y = piece.color === 'w' ? Math.PI / 2 : -Math.PI / 2;
            pieceMesh.position.set(col - boardOffset, 0.05, row - boardOffset);
            pieceMesh.userData = { squareName: String.fromCharCode(97 + col) + (8 - row) };
            piecesGroup.add(pieceMesh);
          }
        }
      }
    }

    // Controls
    let selectedSquare = null;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function clearHighlights() {
      while (highlightsGroup.children.length > 0) {
        highlightsGroup.remove(highlightsGroup.children[0]);
      }
    }

    function highlightSquare(squareName, colorHex) {
      const target = boardSquares[squareName];
      if (!target) return;
      const highlightGeo = new THREE.PlaneGeometry(0.9, 0.9);
      const highlightMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
      const mesh = new THREE.Mesh(highlightGeo, highlightMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(target.position.x, 0.06, target.position.z);
      highlightsGroup.add(mesh);
    }

    window.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([...boardGroup.children, ...piecesGroup.children], true);

      if (intersects.length > 0) {
        let clickedObject = intersects[0].object;
        while (clickedObject.parent && clickedObject.parent !== boardGroup && clickedObject.parent !== piecesGroup) {
          clickedObject = clickedObject.parent;
        }

        const squareName = clickedObject.userData.squareName;

        if (selectedSquare) {
          const move = game.move({ from: selectedSquare, to: squareName, promotion: 'q' });
          if (move) {
            selectedSquare = null;
            clearHighlights();
            renderPieces();
            updateStatus();
            return;
          }
        }

        const piece = game.get(squareName);
        if (piece && piece.color === game.turn()) {
          selectedSquare = squareName;
          clearHighlights();
          highlightSquare(squareName, 0xffff00);
          const moves = game.moves({ square: squareName, verbose: true });
          moves.forEach((m) => highlightSquare(m.to, 0x00ff00));
        } else {
          selectedSquare = null;
          clearHighlights();
        }
      }
    });

    function updateStatus() {
      const statusEl = document.getElementById('status');
      let statusText = game.turn() === 'w' ? 'Light Pink Team' : 'Deep Pink Team';
      if (game.in_check()) statusText += ' - CHECK!';
      if (game.in_checkmate()) statusText = 'Game Over - Checkmate!';
      statusEl.textContent = statusText;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    loadAllModels();

    function animate() {
      requestAnimationFrame(animate);

      const time = Date.now() * 0.0025;
      piecesGroup.children.forEach((piece, idx) => {
        piece.position.y = 0.05 + Math.sin(time + idx * 0.4) * 0.015;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
