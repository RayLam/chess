<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquatic Dolphin Chess</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #02080c;
      font-family: Arial, sans-serif;
    }
    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffffff;
      background: rgba(5, 20, 30, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #00e5ff44;
      pointer-events: none;
      z-index: 100;
    }
    #status {
      font-weight: bold;
      color: #ff69b4;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <div id="info">
    <h2 style="margin:0 0 4px 0;">Aquatic Dolphin Chess</h2>
    <p style="margin:0;">Turn: <span id="status">Light Pink Team</span></p>
  </div>

  <script>
    // --- 1. ENGINE & SCENE SETUP ---
    const game = new Chess();
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;

    // --- 2. LIGHTING SETUP ---
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
    keyLight.position.set(5, 12, 8);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x00e5ff, 0.5);
    fillLight.position.set(-5, 6, -5);
    scene.add(fillLight);

    const boardGroup = new THREE.Group();
    const piecesGroup = new THREE.Group();
    const highlightsGroup = new THREE.Group();
    scene.add(boardGroup);
    scene.add(piecesGroup);
    scene.add(highlightsGroup);

    // Lagoon Base
    const lagoonGeo = new THREE.BoxGeometry(9.6, 1.5, 9.6);
    const lagoonMat = new THREE.MeshPhongMaterial({ color: 0x004466, transparent: true, opacity: 0.85 });
    const lagoon = new THREE.Mesh(lagoonGeo, lagoonMat);
    lagoon.position.y = -0.8;
    scene.add(lagoon);

    // Glass Board
    const boardOffset = 3.5;
    const boardSquares = {};

    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const isLight = (row + col) % 2 === 0;
        const squareGeo = new THREE.BoxGeometry(1, 0.1, 1);
        const squareMat = new THREE.MeshPhongMaterial({
          color: isLight ? 0xb2ebf2 : 0x004d40,
          transparent: true,
          opacity: 0.75
        });
        const square = new THREE.Mesh(squareGeo, squareMat);
        const squareName = String.fromCharCode(97 + col) + (8 - row);

        square.position.set(col - boardOffset, 0, row - boardOffset);
        square.receiveShadow = true;
        square.userData = { squareName };
        boardGroup.add(square);
        boardSquares[squareName] = square;
      }
    }

    // --- 3. PHYSICAL SHADOW MATERIALS ---
    const whiteMaterial = new THREE.MeshStandardMaterial({
      color: 0xffa3c4,
      roughness: 0.2,
      metalness: 0.1
    });

    const blackMaterial = new THREE.MeshStandardMaterial({
      color: 0x99004d,
      roughness: 0.2,
      metalness: 0.1
    });

    // --- 4. SAFE MODEL LOADING ---
    const loader = new THREE.GLTFLoader();
    const pieceModels = {};
    const modelFiles = { p: 'pawn.glb', n: 'knight.glb', b: 'bishop.glb', r: 'rook.glb', q: 'queen.glb', k: 'king.glb' };

    function normalizeAndCenterModel(model) {
      const wrapper = new THREE.Group();
      wrapper.add(model);

      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= box.min.y;

      const maxDim = Math.max(size.x, size.z);
      if (maxDim > 0) {
        const scale = 0.75 / maxDim;
        wrapper.scale.set(scale, scale, scale);
      }

      return wrapper;
    }

    function loadAllModels() {
      loader.load(
        './pawn.glb',
        (pawnGltf) => {
          const basePawnModel = normalizeAndCenterModel(pawnGltf.scene);
          pieceModels['p'] = basePawnModel;

          const types = ['n', 'b', 'r', 'q', 'k'];
          let loadedCount = 0;

          types.forEach((type) => {
            loader.load(
              `./${modelFiles[type]}`,
              (gltf) => {
                pieceModels[type] = normalizeAndCenterModel(gltf.scene);
                loadedCount++;
                if (loadedCount === types.length) renderPieces();
              },
              undefined,
              () => {
                pieceModels[type] = basePawnModel.clone(true);
                loadedCount++;
                if (loadedCount === types.length) renderPieces();
              }
            );
          });

          renderPieces();
        },
        undefined,
        (err) => {
          console.error("Error loading pawn.glb:", err);
        }
      );
    }

    function renderPieces() {
      while (piecesGroup.children.length > 0) {
        piecesGroup.remove(piecesGroup.children[0]);
      }

      const boardState = game.board();
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = boardState[row][col];
          if (piece && pieceModels[piece.type]) {
            const pieceMesh = pieceModels[piece.type].clone(true);
            const targetMaterial = piece.color === 'w' ? whiteMaterial : blackMaterial;

            pieceMesh.traverse((child) => {
              if (child.isMesh) {
                child.material = targetMaterial;
                child.castShadow = true;
                child.receiveShadow = true;
              }
            });

            pieceMesh.rotation.y = piece.color === 'w' ? Math.PI / 2 : -Math.PI / 2;
            pieceMesh
